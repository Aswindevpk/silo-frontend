name: Restrict Merges to Main

on:
  pull_request:
    branches:
      - main

jobs:
  check-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR source is dev
        run: |
          echo "Base branch: ${{ github.base_ref }}"
          echo "Head branch: ${{ github.head_ref }}"

          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "::error::Only the 'dev' branch is allowed to be merged into 'main'. PRs from '${{ github.head_ref }}' are rejected."
            exit 1
          fi